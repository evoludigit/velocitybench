[pytest]
# Site build tests run under the QA venv (stdlib-only build, no coverage
# plugins). This nested config overrides the repo-root pytest.ini so
# `tests/qa/.venv/bin/python -m pytest site/tests/` needs no extra plugins.
addopts = -q --tb=short
testpaths = tests
python_files = test_*.py
python_functions = test_*
