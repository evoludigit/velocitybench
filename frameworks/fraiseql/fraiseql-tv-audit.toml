# FraiseQL — Server Runtime Configuration (TV Tables + Audit Logging)
# Audit logging enabled in compiled schema; compare M1 latency vs fraiseql-tv.

schema_path = "schema_tv_audit.compiled.json"
database_url = "postgresql://benchmark:benchmark123@postgres:5432/velocitybench_benchmark"
bind_addr = "0.0.0.0:8815"

cors_enabled = false

pool_min_size = 10
pool_max_size = 50
pool_timeout_secs = 30

introspection_enabled = true
introspection_require_auth = false

playground_enabled = false
metrics_enabled = false

cache_enabled = true

[validation]
max_query_complexity = 200

